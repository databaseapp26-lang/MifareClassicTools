```yaml
name: Build MFOC Hardnested Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Download source
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/nfc-tools/mfoc-hardnested/archive/refs/heads/master.zip" `
            -OutFile "$env:RUNNER_TEMP\mfoc.zip"
          Expand-Archive "$env:RUNNER_TEMP\mfoc.zip" `
            -DestinationPath "$env:RUNNER_TEMP\mfoc"

      - name: Locate Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build executable
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\mfoc\mfoc-hardnested-master"
          $solution = Join-Path $root "mfoc-hardnested.sln"

          if (!(Test-Path $solution)) {
            throw "Solution Visual Studio non trovata: $solution"
          }

          msbuild $solution /m /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=ClangCL `
            /p:WindowsTargetPlatformVersion=10.0 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Compilazione non riuscita."
          }

      - name: Collect build files
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\mfoc\mfoc-hardnested-master"
          $out = "$env:GITHUB_WORKSPACE\mfoc-windows-build"
          New-Item -ItemType Directory -Force $out | Out-Null

          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in ".exe", ".dll"
            } |
            Copy-Item -Destination $out -Force

          if (!(Get-ChildItem $out -Filter "*.exe")) {
            throw "Nessun eseguibile trovato."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mfoc-hardnested-windows-x64
          path: mfoc-windows-build/*
          if-no-files-found: error
```
