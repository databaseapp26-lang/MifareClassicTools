
name: Build MFOC Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download MFOC-Hardnested source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/nfc-tools/mfoc-hardnested/archive/refs/heads/master.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mfoc.zip"
          Expand-Archive "$env:RUNNER_TEMP\mfoc.zip" -DestinationPath $env:RUNNER_TEMP -Force
          "SOURCE_DIR=$env:RUNNER_TEMP\mfoc-hardnested-master" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inspect NFC source and build configuration
        shell: pwsh
        run: |
          $root = $env:SOURCE_DIR
          Write-Host "=== NFC and PCSC files ==="
          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Name -match 'pcsc|winscard|libnfc|libusb|nfc\.conf'
            } |
            Select-Object -ExpandProperty FullName

          Write-Host "=== Backend and reader references ==="
          Get-ChildItem $root -Recurse -File |
            Where-Object {
              $_.Extension -in '.c','.h','.cpp','.vcxproj','.props','.sln'
            } |
            Select-String -Pattern 'PCSC|winscard|libusb|acr1281|ACR122|reader' |
            Select-Object -First 100 Path, LineNumber, Line

      - name: Configure Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $solution = Join-Path $env:SOURCE_DIR "mfoc-hardnested.sln"
          if (!(Test-Path $solution)) {
            throw "Solution Visual Studio non trovata: $solution"
          }
          msbuild $solution /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=ClangCL /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Compilazione fallita."
          }

      - name: Prepare downloadable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:SOURCE_DIR
          $package = Join-Path $env:GITHUB_WORKSPACE "mfoc-windows-package"
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $exe = Get-ChildItem $root -Recurse -File -Filter "mfoc-hardnested.exe" |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Select-Object -First 1

          if (!$exe) {
            throw "Eseguibile non trovato dopo la compilazione."
          }

          Copy-Item $exe.FullName $package

          foreach ($dll in @("libusb0.dll", "nfc.dll")) {
            $file = Join-Path $root "src\lib\$dll"
            if (Test-Path $file) {
              Copy-Item $file $package
            } else {
              Write-Host "DLL non trovata nel percorso previsto: $file"
            }
          }

          Get-ChildItem $package | Select-Object Name, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MFOC-Hardnested-Windows-x64
          path: mfoc-windows-package/*
          if-no-files-found: error
